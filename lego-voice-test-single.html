<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LEGO Shelf Finder — Voice Test</title><style>body{font:16px system-ui,sans-serif;max-width:550px;margin:24px auto;padding:0 18px;background:#f5f7fa;color:#18212d}h1{font-size:1.5rem}button{font:inherit;padding:12px 16px;border:0;border-radius:9px;background:#1765c1;color:white;margin:5px 5px 8px 0}button:disabled{opacity:.5}textarea{box-sizing:border-box;width:100%;min-height:170px;padding:12px;font:inherit;border:1px solid #aaa;border-radius:8px}#status{padding:12px;background:white;border-radius:8px;white-space:pre-wrap}small{color:#505967}</style></head><body><h1>LEGO Shelf Finder</h1><p>Voice recognition test — single HTML file</p><button id="start">Start Recording</button><button id="stop" disabled>Stop Recording</button><button id="clear">Clear</button><p id="status" role="status">Page loaded. Checking speech recognition…</p><label for="output"><strong>Recognized speech</strong></label><textarea id="output" placeholder="Your words will appear here. You can also type here."></textarea><p><small>If speech recognition is unavailable, try opening this page from an HTTPS website. Voice input may require an internet connection.</small></p><script>
(function(){
 const start=document.getElementById('start'),stop=document.getElementById('stop'),clear=document.getElementById('clear'),status=document.getElementById('status'),output=document.getElementById('output');
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 let rec=null,active=false,base='';
 function say(message){status.textContent=message;}
 if(!SR){say('Speech recognition is not available in this browser or page context. JavaScript is working (this message was generated by JavaScript).');start.disabled=true;}
 else {say('JavaScript loaded. Speech recognition API detected. Tap Start Recording.');try{rec=new SR();rec.lang='en-US';rec.interimResults=true;rec.continuous=false;rec.onstart=()=>{active=true;start.disabled=true;stop.disabled=false;say('Listening… Speak now.');};rec.onresult=e=>{let result='';for(let i=0;i<e.results.length;i++)result+=e.results[i][0].transcript+' ';output.value=base+result.trim();say('Speech received.');};rec.onerror=e=>{say('Speech recognition error: '+e.error+(e.message?' — '+e.message:''));};rec.onend=()=>{active=false;start.disabled=false;stop.disabled=true;if(status.textContent==='Listening… Speak now.')say('Recording ended.');};}catch(e){say('Could not initialize recognition: '+e.message);start.disabled=true;}}
 start.addEventListener('click',()=>{if(!rec)return;base=output.value.trim();if(base)base+='\n';try{say('Starting speech recognition…');rec.start();}catch(e){say('Start failed: '+e.message);}});
 stop.addEventListener('click',()=>{if(rec&&active){say('Stopping…');rec.stop();}});
 clear.addEventListener('click',()=>{output.value='';base='';say('Text cleared.');});
})();
</script></body></html>
