<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LEGO Shelf Finder Voice Diagnostic V5</title>
<style>body{font:17px system-ui,Arial,sans-serif;background:#f3f5fa;color:#182335;margin:0;padding:20px;max-width:800px}h1{font-size:1.8rem}button,select{font:inherit;padding:12px;border-radius:10px;border:1px solid #aeb8c7}button{background:#1664ba;color:white;border:0;margin:4px 5px 4px 0}button:disabled{opacity:.45}label{display:block;font-weight:650;margin-top:16px}textarea{box-sizing:border-box;width:100%;height:175px;padding:12px;font:17px system-ui;border-radius:10px;border:1px solid #aeb8c7}#log{height:240px;font:12px ui-monospace,monospace}#status{padding:15px;background:white;border-left:6px solid #aeb8c7;border-radius:10px;margin:18px 0;white-space:pre-wrap}small{color:#536071}select{max-width:100%}</style></head><body>
<h1>LEGO Shelf Finder</h1><p>Voice diagnostic — <strong>Version 5</strong></p>
<label for="mode">Test mode</label><select id="mode"><option value="single">A — Continuous, no automatic restart</option><option value="restart">B — Continuous, automatic restart</option></select>
<p><button id="start">Start Recording</button><button id="stop" disabled>Stop Recording</button><button id="clear">Clear</button></p>
<div id="status" role="status">Ready.</div>
<label for="transcript">Recognized speech (final + current interim)</label><textarea id="transcript" spellcheck="false"></textarea>
<label for="log">Diagnostic log (copy this if the words repeat)</label><textarea id="log" readonly spellcheck="false"></textarea>
<p><button id="copy">Copy diagnostic log</button></p><small>This diagnostic does not save inventory. Mode A may stop by itself; Mode B attempts to reconnect. The log shows browser result events and whether results are final or interim. No audio is recorded or saved by this page.</small>
<script>
(()=>{'use strict';
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const $=id=>document.getElementById(id),start=$('start'),stop=$('stop'),clear=$('clear'),mode=$('mode'),status=$('status'),out=$('transcript'),log=$('log');
let desired=false,rec=null,token=0,timer=null,completed=[],results=[],sessionNumber=0,events=0,failures=0,stopRequested=false;
const clean=s=>String(s||'').replace(/\s+/g,' ').trim();
function note(s){log.value+=`[${new Date().toLocaleTimeString()}] ${s}\n`;log.scrollTop=log.scrollHeight;}
function state(s){status.textContent=s;}
function buttons(){start.disabled=desired||!SR;stop.disabled=!desired;mode.disabled=desired;}
function render(){const current=results.map(x=>x.text).filter(Boolean).join(' ');out.value=[...completed,current].filter(Boolean).join(' ').trim();}
function finishSession(){const finalized=results.filter(x=>x.final).map(x=>x.text).filter(Boolean).join(' ');if(finalized)completed.push(finalized);results=[];render();}
function cancel(){if(timer!==null){clearTimeout(timer);timer=null;}}
function launch(){if(!desired)return;cancel();const my=++token;sessionNumber++;events=0;results=[];let r;try{r=new SR();rec=r;r.lang='en-US';r.continuous=true;r.interimResults=true;r.maxAlternatives=1;
r.onstart=()=>{if(my!==token)return;failures=0;state('Listening — session '+sessionNumber);note('START session '+sessionNumber);};
r.onresult=e=>{if(my!==token)return;events++;const list=[];for(let i=0;i<e.results.length;i++){const x=e.results[i];list.push({text:clean(x[0]?.transcript),final:x.isFinal});}results=list;render();note(`RESULT session=${sessionNumber} event=${events} resultIndex=${e.resultIndex} length=${e.results.length} `+JSON.stringify(list.map((x,i)=>({i,final:x.final,text:x.text}))));};
r.onerror=e=>{if(my!==token)return;note('ERROR '+e.error);state('Speech error: '+e.error);if(['not-allowed','service-not-allowed','audio-capture'].includes(e.error)){desired=false;cancel();buttons();try{r.abort();}catch(_){}}};
r.onend=()=>{if(my!==token)return;note('END session '+sessionNumber+' (stopRequested='+stopRequested+')');finishSession();rec=null;if(!desired){state(stopRequested?'Stopped by you.':'Stopped.');buttons();return;}if(mode.value==='single'){desired=false;buttons();state('Browser ended session. Mode A does not restart.');return;}if(++failures>6){desired=false;buttons();state('Stopped: too many restart attempts.');return;}state('Reconnecting — browser ended the session…');timer=setTimeout(()=>{timer=null;if(desired)launch();},600);};
r.start();state('Starting microphone…');note('START REQUEST session '+sessionNumber);
}catch(err){note('START ERROR '+err.message);state('Unable to start: '+err.message);rec=null;desired=false;buttons();}}
start.onclick=()=>{if(!SR||desired)return;completed=out.value.trim()?[out.value.trim()]:[];results=[];desired=true;stopRequested=false;failures=0;buttons();note('USER tapped Start; mode='+mode.value);launch();};
stop.onclick=()=>{if(!desired)return;desired=false;stopRequested=true;cancel();buttons();note('USER tapped Stop');state('Stopping…');if(rec){try{rec.stop();}catch(err){note('STOP ERROR '+err.message);finishSession();state('Stopped by you.');}}else{state('Stopped by you.');}};
clear.onclick=()=>{if(desired){note('Clear pressed while listening; transcript cleared');}completed=[];results=[];out.value='';log.value='';};
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(log.value);state('Diagnostic log copied.');}catch(e){log.focus();log.select();state('Select and copy the diagnostic log manually.');}};
if(!SR)state('Speech recognition is unavailable in this browser.');buttons();
})();
</script></body></html>
